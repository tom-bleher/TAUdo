name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test
        run: scripts/build.sh test
      - name: Check Hebrew translations
        run: scripts/check_translations.sh
