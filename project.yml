name: TAUdo
options:
  bundleIdPrefix: io.github.tombleher
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.10.1
targets:
  TAUdo:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: assets/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: Sparkle
        product: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TAUdo
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.5.1"
        CFBundleVersion: "6"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: io.github.tombleher.TAUdo.sync
            CFBundleURLSchemes: [taudo]
        LSApplicationCategoryType: public.app-category.education
        # Updates: scripts/release.sh publishes the DMG and a signed appcast.xml to GitHub Releases.
        SUFeedURL: https://github.com/tom-bleher/TAUdo/releases/latest/download/appcast.xml
        SUPublicEDKey: yLwyCH132n81/2oMALJKB3w2JC64YMCKjxO2cpMtsEQ=
        SUEnableAutomaticChecks: true
        NSCalendarsFullAccessUsageDescription: TAUdo writes your Moodle deadlines into its own calendar so they show up in Apple Calendar.
        NSCalendarsUsageDescription: TAUdo writes your Moodle deadlines into its own calendar so they show up in Apple Calendar.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tombleher.TAUdo
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: TAUdo.entitlements
  TAUdoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests, Sources/Core, Sources/Services/MoodleFeed.swift, Sources/Services/MoodleConnect.swift, Sources/UI/Logo.swift, Sources/Services/Lang.swift, Sources/Services/DownloadMover.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TAUdo:
    build:
      targets:
        TAUdo: all
    test:
      targets: [TAUdoTests]
