name: TAUdo
options:
  bundleIdPrefix: io.github.tombleher
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  TAUdo:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: assets/AppIcon.icns
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TAUdo
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: io.github.tombleher.TAUdo.sync
            CFBundleURLSchemes: [taudo]
        LSApplicationCategoryType: public.app-category.education
        NSCalendarsFullAccessUsageDescription: TAUdo writes your Moodle deadlines into its own calendar so they show up in Apple Calendar.
        NSCalendarsUsageDescription: TAUdo writes your Moodle deadlines into its own calendar so they show up in Apple Calendar.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tombleher.TAUdo
        ENABLE_HARDENED_RUNTIME: NO
  TAUdoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests, Sources/Core, Sources/Services/MoodleFeed.swift, Sources/Services/MoodleConnect.swift, Sources/Services/Lang.swift, Sources/Services/DownloadMover.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TAUdo:
    build:
      targets:
        TAUdo: all
    test:
      targets: [TAUdoTests]
